name: Gerar APK Android
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake
          python -m pip install git+https://github.com/kivy/buildozer setuptools legacy-cgi 'cython==0.29.34'
      - name: Testar lógica
        run: python -m unittest discover -s tests -v
      - name: Compilar APK de teste
        # Acceptance is explicit for this manual CI job only.
        run: |
          sed -i 's/android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
          buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: Passo-Python-APK
          path: bin/*.apk
          if-no-files-found: error
