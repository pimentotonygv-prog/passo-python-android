name: Gerar APK Android
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  map-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar teste visual do mapa
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libgles2 libmtdev1
          python -m pip install --only-binary=:all: kivy kivy_garden.mapview requests certifi
      - name: Testar mapa com imagens reais
        env:
          KIVY_NO_ARGS: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a python tools/smoke_map.py
      - uses: actions/upload-artifact@v4
        with:
          name: Mapa-validado
          path: mapa-validado*.png
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake
          python -m pip install git+https://github.com/kivy/buildozer setuptools legacy-cgi 'cython==0.29.34'
      - name: Testar lógica
        run: python -m unittest discover -s tests -v
      - uses: actions/cache/restore@v4
        id: android-cache
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: passo-p4a-20260509-ndk28c-py314-v1-${{ github.run_id }}
          restore-keys: passo-p4a-20260509-ndk28c-py314-v1-
      - name: Preparar compilador Python Android
        run: |
          git clone --depth 1 --branch v2026.05.09 https://github.com/kivy/python-for-android .p4a
          python tools/prepare_p4a.py .p4a
      - name: Compilar APK de teste
        # Acceptance is explicit for this manual CI job only.
        run: |
          sed -i 's/android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
          buildozer -v android debug > build.log 2>&1 || { tail -n 180 build.log; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: Passo-Python-APK
          path: bin/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Relatorio-compilacao
          path: build.log
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ steps.android-cache.outputs.cache-primary-key }}
